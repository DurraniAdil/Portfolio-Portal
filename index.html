<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio-Portal</title>
  <link rel="icon" type="image/png" href="./media/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    /* Custom Scrollbar Hide */
    body {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
      background-color: #000;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
    }

    body::-webkit-scrollbar {
      display: none;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    .font-display {
      font-family: 'Orbitron', sans-serif;
    }

    .snap-y-mandatory {
      scroll-snap-type: y mandatory;
    }

    .snap-start {
      scroll-snap-align: start;
    }

    /* Hologram effect utilities */
    .hologram-text {
      text-shadow: 0 0 5px rgba(0, 229, 255, 0.7), 0 0 10px rgba(0, 229, 255, 0.5);
    }

    .hologram-border {
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.3), inset 0 0 20px rgba(0, 229, 255, 0.1);
    }

    .hologram-red-text {
      text-shadow: 0 0 5px rgba(255, 0, 85, 0.7), 0 0 10px rgba(255, 0, 85, 0.5);
    }

    /* Star animations */
    @keyframes twinkle {

      0%,
      100% {
        opacity: 0.8;
        transform: scale(1);
      }

      50% {
        opacity: 0.3;
        transform: scale(0.8);
      }
    }

    .animate-twinkle {
      animation: twinkle 4s infinite ease-in-out;
    }

    /* Scanline effect */
    .scanline {
      background: linear-gradient(to bottom,
          rgba(255, 255, 255, 0),
          rgba(255, 255, 255, 0) 50%,
          rgba(0, 0, 0, 0.2) 50%,
          rgba(0, 0, 0, 0.2));
      background-size: 100% 4px;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0.15;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'neon-blue': '#00e5ff',
            'neon-red': '#ff0055',
            'void-black': '#050505',
            'space-gray': '#1a1a2e',
          },
          fontFamily: {
            display: ['Orbitron', 'sans-serif'],
            body: ['Rajdhani', 'sans-serif'],
          },
          animation: {
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "framer-motion": "https://esm.sh/framer-motion@^12.27.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>

</head>

<body>
  <div id="root"></div>

</body>

</html>
